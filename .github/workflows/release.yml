name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      clawhub_only:
        description: Recover ClawHub for a release already published to npm
        type: boolean
        default: false
      release_tag:
        description: Existing release tag, required for ClawHub recovery (for example v2.31.0)
        type: string
        required: false

permissions:
  contents: read

# Registry writes never overlap, and a newer push cannot interrupt an upload.
concurrency:
  group: clawgram-release
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.clawhub_only }}
  RECOVER_CLAWHUB: ${{ inputs.clawhub_only == true }}
  RELEASE_REF: ${{ inputs.clawhub_only && inputs.release_tag || github.ref_name }}

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance; no stored npm token
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
      release_ref: ${{ steps.publish.outputs.release_ref }}
    defaults:
      run:
        working-directory: source
    steps:
      - name: Validate recovery tag
        if: inputs.clawhub_only
        working-directory: ${{ github.workspace }}
        run: |
          [[ "${RELEASE_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ClawHub recovery requires an existing stable release tag." >&2
            exit 1
          }

      # Recovery uses current safeguards even for tags predating these scripts.
      - uses: actions/checkout@v6
        with:
          path: release-tools
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          path: source
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Tag must match package.json version
        if: github.event_name == 'push' || inputs.clawhub_only
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          test "${RELEASE_REF}" = "v${pkg_version}" || { echo "Tag/version mismatch." >&2; exit 1; }

      - run: npm ci

      - name: Hand check-pii its denylist
        env:
          DENYLIST: ${{ secrets.CLAWGRAM_PII_DENYLIST }}
        run: |
          if [ -z "${DENYLIST}" ]; then
            echo "::warning::CLAWGRAM_PII_DENYLIST secret is not set — check-pii runs the shape check only"
            exit 0
          fi
          file="${RUNNER_TEMP}/clawgram-pii-denylist.txt"
          ( umask 077; printf '%s\n' "${DENYLIST}" > "${file}" )
          echo "CLAWGRAM_PII_DENYLIST=${file}" >> "$GITHUB_ENV"
          echo "check-pii denylist: $(grep -cvE '^[[:space:]]*(#|$)' "${file}") entries"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # An existing version is safe to skip only when its npm gitHead matches.
      # Manual runs rehearse; recovery verifies npm without a publish attempt.
      - name: Publish or verify npm release
        id: publish
        run: node ../release-tools/scripts/release-npm.mjs

  clawhub:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: npm-publish
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          path: release-tools
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          path: source
          ref: ${{ needs.npm.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci
      - run: npm run build
      - run: npm install --global --no-fund --no-audit clawhub@0.25.0

      - name: Publish or verify ClawHub release
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          RELEASE_REF: ${{ needs.npm.outputs.release_ref }}
        run: |
          args=()
          if [ "${DRY_RUN}" = true ]; then args+=(--dry-run); fi
          node ../release-tools/scripts/publish-clawhub.mjs "${args[@]}"
