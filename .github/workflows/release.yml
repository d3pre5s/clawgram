name: Release

# Publishing is driven by tags: push v2.2.0 and this builds, tests and
# publishes clawgram@2.2.0 from a clean checkout. Nothing is published from
# a laptop any more, and provenance ties the tarball on npm back to the exact
# commit this workflow ran on.
#
# The same job can be run by hand as a rehearsal (workflow_dispatch): it does
# everything up to and including `npm publish --dry-run`, so the release path
# can be verified without putting a version into the registry forever.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    env:
      # A manual run is always a rehearsal; only a tag publishes for real.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # A tag that disagrees with package.json would publish a version nobody
      # asked for, under a tag that points somewhere else. Refuse instead.
      - name: Tag must match package.json version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag ${GITHUB_REF_NAME} implies ${tag_version}, package.json says ${pkg_version}" >&2
            exit 1
          fi
          echo "publishing clawgram@${pkg_version}"

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Publishing the same version twice fails the job anyway; checking first
      # gives a readable reason instead of a registry error. A rehearsal skips
      # this on purpose — the current version is normally already published.
      - name: Version must not already exist on npm
        if: github.event_name == 'push'
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "clawgram@${pkg_version}" version >/dev/null 2>&1; then
            echo "clawgram@${pkg_version} is already published — bump the version first" >&2
            exit 1
          fi

      # Catches the most common release failure — a missing or wrong-scoped
      # NPM_TOKEN — before the publish step, and with a clear message.
      - name: Check npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not set — publishing will fail." >&2
            echo "Add an npm automation token as the NPM_TOKEN secret." >&2
            exit 1
          fi
          echo "authenticated to npm as: $(npm whoami)"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "rehearsal: packing without publishing"
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi

      # ClawHub is a second registry, not a mirror: it carries its own scan
      # verdict and its own install path. It fell two versions behind npm once
      # already because publishing here was a separate manual step.
      #
      # npm is the primary path, so a ClawHub failure must not undo a release
      # that already reached npm — but it does fail the job, because "npm has
      # it, ClawHub does not" is exactly the state worth being told about.
      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "${CLAWHUB_TOKEN}" ]; then
            echo "::warning::CLAWHUB_TOKEN is not set — skipped ClawHub. npm is unaffected."
            exit 0
          fi

          npm install --global --no-fund --no-audit clawhub@0.23.1

          # The CLI takes the token as an argument; the runner is ephemeral and
          # single-use, so argv exposure is bounded to this job.
          clawhub login --token "${CLAWHUB_TOKEN}" >/dev/null

          pkg_version="$(node -p "require('./package.json').version")"
          published="$(clawhub package explore clawgram --family code-plugin 2>/dev/null \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | tr -d 'v')"

          if [ "${published}" = "${pkg_version}" ]; then
            echo "ClawHub already carries ${pkg_version} — nothing to do"
            exit 0
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "rehearsal: ClawHub publish without uploading"
            clawhub package publish . --family code-plugin --version "${pkg_version}" \
              --source-repo d3pre5s/clawgram --source-ref "${GITHUB_REF_NAME}" \
              --source-commit "${GITHUB_SHA}" --dry-run
            exit 0
          fi

          clawhub package publish . --family code-plugin --version "${pkg_version}" \
            --source-repo d3pre5s/clawgram --source-ref "${GITHUB_REF_NAME}" \
            --source-commit "${GITHUB_SHA}"
